name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # setup-node is needed for make check's nodejs smoke walk
      # (tests/test_smoke_nodejs_generated.py); NOT for make install,
      # which is pure-pip in the skill repo.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: make install
        run: make install
      - name: make check
        run: make check
        env:
          CI: "true"  # make the nodejs smoke walk fail hard on missing node, not skip
