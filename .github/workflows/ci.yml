name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs when new commits land on the same ref, so a rapid
# push-push-push burst bills one run instead of three. Concurrency groups are
# repository-global, not per-file. The key is `github.workflow_ref` (the workflow
# FILE path + ref) rather than `github.workflow`, which is only the display name —
# two workflows both named `CI` would otherwise share one group and cancel each
# other. workflow_ref already encodes the ref, so it needs no `github.ref` suffix.
#
# cancel-in-progress is deliberately FALSE on main: a cancelled push-to-main run
# leaves the merge commit with no green check. Nothing downstream gates on it
# today (no deploy platform, no release job, and required status checks are not
# available on this plan), so this is cheap insurance rather than a live
# dependency — flip it to plain `true` only if that stays true and main-push
# runs ever become frequent enough to matter.
#
# Scope of that protection: cancel-in-progress governs only the RUNNING job. A
# run still QUEUED in the same group is always superseded when a newer one is
# queued, whatever this is set to — so in a rapid push burst to main the middle
# commit can still go without CI. That is the batching working as intended, not
# a bug, but it is not the same as "nothing on main is ever skipped".
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # setup-node is needed for make check's nodejs smoke walk
      # (tests/test_smoke_nodejs_generated.py); NOT for make install,
      # which is pure-pip in the skill repo.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # setup-go is needed for the Go smoke walk; cache: false because
      # the stdlib-only smoke project has no go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      # setup-uv is needed for the Python+uv smoke walk
      # (tests/test_smoke_python_uv_generated.py); NOT for make install,
      # which is pure-pip in the skill repo. Skill-repo setup-uv takes
      # NO `python-version` input (setup-python@v5 above already owns
      # Python). Contrast: the *generated* project's ci.yml.tmpl DOES
      # pass python-version to setup-uv because setup-uv replaces
      # setup-python in that file. Exact tag (not bare @v8) because
      # setup-uv v8 has no floating major tag.
      - uses: astral-sh/setup-uv@v8.1.0
      - name: uv --version
        run: uv --version
      - name: make install
        run: make install
      - name: make check
        run: make check
        env:
          CI: "true"  # make the nodejs + go + uv smoke walks fail hard on missing tools, not skip
